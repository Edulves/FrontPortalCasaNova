<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada · Feliz Casa Nova</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .err-page { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:2rem; text-align:center; }
    .err-page h1 { font-family: Fraunces, Georgia, serif; font-size: clamp(2rem, 6vw, 3.2rem); margin: 0 0 .5rem; color: var(--ink, #152433); }
    .err-page p { color: var(--muted, #6a6258); max-width: 28rem; margin: 0 auto 1.5rem; }
    .err-code { font-family: "IBM Plex Mono", monospace; letter-spacing: .08em; color: var(--brick, #ab5236); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="err-page">
    <div>
      <p class="err-code">404</p>
      <h1>Feliz Casa Nova</h1>
      <p>Não encontramos esta página. Volte ao painel de vendas ou faça login novamente.</p>
      <a class="btn btn-primary" href="/">Ir para o painel</a>
    </div>
  </div>
</body>
</html>
